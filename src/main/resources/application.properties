server.port=8090

# ViewResolver cho JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/static/**

# UTF-8 Encoding
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# Kết nối SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SpringBoot4_WebMVC;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1234@a$
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Multipart Upload (chuẩn bị cho upload ảnh Category & User)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Session timeout 30 phút
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# Thư mục lưu ảnh upload cục bộ
app.upload.dir=D:/upload-springboot4
